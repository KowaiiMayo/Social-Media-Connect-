<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaizu Edits</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* --- DAY MODE (Default - Soft/Dreamy) --- */
            --bg-gradient: linear-gradient(135deg, #a8edea, #fed6e3); /* Pastel Blue/Pink */
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
            --text-color: #2d3436; /* Dark Grey text for readability on light bg */
            --accent-color: #ff6b6b; 
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --btn-bg: rgba(255, 255, 255, 0.5);
            --btn-hover: rgba(255, 255, 255, 0.8);
            --particle-color: #ffffff;
            --icon-color: #2d3436;
        }

        /* --- NIGHT MODE (Twilight Vibe) --- */
        body.dark-mode {
            --bg-gradient: linear-gradient(135deg, #2b1055, #7597de, #e3a5c7);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --accent-color: #ffd700; 
            --card-shadow: 0 10px 30px rgba(31, 38, 135, 0.4);
            --btn-bg: rgba(255, 255, 255, 0.15);
            --btn-hover: rgba(255, 255, 255, 0.3);
            --particle-color: #ffffff;
            --icon-color: #ffffff;
        }

        /* --- HOVER THEME: YOUTUBE (Aesthetic Strawberry/Peach) --- */
        /* Much lighter and softer than before */
        body.theme-youtube {
            --bg-gradient: linear-gradient(135deg, #ff9a9e, #fecfef, #feada6);
            --accent-color: #ff3f34; 
            --text-color: #590d0d; /* Dark Red text */
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
            --btn-hover: rgba(255, 255, 255, 0.6);
            --card-shadow: 0 10px 40px rgba(255, 63, 52, 0.2);
            --particle-color: #fff;
            --icon-color: #c0392b;
        }

        /* --- HOVER THEME: INSTAGRAM (Vibrant Sunset/Spooky) --- */
        body.theme-instagram {
            --bg-gradient: linear-gradient(135deg, #667eea, #764ba2, #ff9e00);
            --accent-color: #ff9e00; 
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --btn-hover: rgba(255, 255, 255, 0.25);
            --card-shadow: 0 10px 40px rgba(118, 75, 162, 0.4);
            --particle-color: #e0aaff;
            --icon-color: #ffffff;
        }

        /* --- HOVER THEME: WHATSAPP (Matcha/Mint/Fresh) --- */
        /* Fresh and airy, not dark forest */
        body.theme-whatsapp {
            --bg-gradient: linear-gradient(135deg, #a8e063, #56ab2f, #11998e);
            --accent-color: #11998e; 
            --text-color: #0f3d3e; /* Dark Teal text */
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
            --btn-hover: rgba(255, 255, 255, 0.6);
            --card-shadow: 0 10px 40px rgba(86, 171, 47, 0.25);
            --particle-color: #d4fc79;
            --icon-color: #1e8449;
        }

        /* Reset & Base Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; 
            color: var(--text-color); 
            transition: background 0.8s ease, color 0.8s ease;
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        #particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

        /* THEME SWITCHER BUTTON */
        .theme-switch {
            position: absolute; top: 20px; right: 20px; 
            background: var(--glass-bg); 
            border: 1px solid var(--glass-border);
            border-radius: 50%; width: 45px; height: 45px; 
            color: var(--text-color); 
            font-size: 1.2rem; cursor: pointer;
            z-index: 20; display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .theme-switch:hover { transform: rotate(20deg) scale(1.1); }

        .card {
            background: var(--glass-bg); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); 
            border-radius: 24px; padding: 40px 30px;
            width: 90%; max-width: 420px; 
            text-align: center; 
            box-shadow: var(--card-shadow);
            z-index: 10; position: relative; animation: floatCard 6s ease-in-out infinite;
            transition: all 0.8s ease;
        }

        @keyframes floatCard { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        /* Central Star */
        .boom-star-container {
            position: relative; height: 70px; display: flex; justify-content: center; align-items: center;
            margin-bottom: 10px; z-index: 5;
        }

        .main-star {
            font-size: 3.5rem; cursor: pointer; display: inline-block;
            filter: drop-shadow(0 0 10px var(--accent-color));
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.5s ease;
            position: relative; z-index: 2;
        }

        /* Boom Effects */
        .boom-star-container::before {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0); width: 20px; height: 20px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,215,0,0.5) 40%, rgba(255,215,0,0) 70%);
            opacity: 0; z-index: 1; pointer-events: none;
        }
        .boom-star-container.boom-active .main-star { animation: starBounce 0.4s ease-out forwards; }
        .boom-star-container.boom-active::before { animation: flashExplosion 0.5s ease-out forwards; }

        @keyframes starBounce { 0% { transform: scale(1); } 40% { transform: scale(1.5) rotate(15deg); filter: drop-shadow(0 0 30px var(--accent-color)); } 100% { transform: scale(1); } }
        @keyframes flashExplosion { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(18); opacity: 0; } }

        /* Title & Subtitle */
        .title-header { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 5px; }
        h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: 1px; transition: color 0.5s ease;}
        .side-sparkle { font-size: 1.8rem; animation: subtleFloat 3s ease-in-out infinite; filter: drop-shadow(0 0 5px var(--particle-color)); transition: filter 0.5s ease; }
        .side-sparkle:last-child { animation-delay: 1.5s; }
        @keyframes subtleFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .subtitle {
            font-size: 1rem; opacity: 0.9; margin-bottom: 30px; font-weight: 600; height: 25px;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.2s ease, transform 0.2s ease, color 0.5s ease;
        }

        /* Links */
        .links { display: flex; flex-direction: column; gap: 15px; }

        .link-item {
            display: flex; align-items: center; justify-content: space-between; padding: 16px 20px;
            background: var(--btn-bg); border-radius: 15px; text-decoration: none; color: var(--text-color);
            transition: all 0.5s ease; border: 1px solid transparent; position: relative; overflow: hidden;
            user-select: none;
        }

        .link-left { display: flex; align-items: center; gap: 15px; font-weight: 600; }
        .link-icon { font-size: 1.4rem; transition: color 0.3s ease; color: var(--icon-color); }
        .arrow { opacity: 0; transform: translateX(-10px); transition: all 0.3s ease; color: var(--icon-color); }

        .link-item:hover, .link-item:active { background: var(--btn-hover); transform: scale(1.02); border-color: var(--accent-color); }
        .link-item:hover .arrow, .link-item:active .arrow { opacity: 1; transform: translateX(0); color: var(--accent-color); }

        .footer { margin-top: 35px; font-size: 0.8rem; opacity: 0.7; font-weight: 500; }

        span.ripple {
            position: absolute; border-radius: 50%; transform: scale(0);
            animation: ripple 600ms linear; background-color: rgba(255, 255, 255, 0.4);
        }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }

        @media (max-width: 480px) { .card { padding: 30px 20px; } h1 { font-size: 1.5rem; } .side-sparkle { font-size: 1.4rem; } }
    </style>
</head>
<body>

    <div id="particles"></div>

    <button class="theme-switch" onclick="toggleGlobalTheme()" aria-label="Toggle Dark Mode">
        <i class="fas fa-moon" id="theme-icon"></i>
    </button>

    <div class="card">
        <div class="boom-star-container" id="boom-box">
            <span class="main-star" id="main-emoji">🌟</span>
        </div>

        <div class="title-header">
            <span class="side-sparkle">✨</span>
            <h1>Kaizu Edits</h1>
            <span class="side-sparkle">✨</span>
        </div>
        
        <p class="subtitle" id="dynamic-text">Video Editor • Anime • Vibes</p>

        <div class="links">
            <a href="https://www.youtube.com/@kaizu_edits" target="_blank" 
               class="link-item ripple-btn" 
               data-emoji="🤩" 
               data-text="Best Quality Anime Edits 🔥"
               data-theme="theme-youtube">
                <div class="link-left"><i class="fab fa-youtube link-icon"></i><span>YouTube Channel</span></div>
                <i class="fas fa-chevron-right arrow"></i>
            </a>
            
            <a href="https://www.instagram.com/kaizu_edits?igsh=MWkyaDB6NG54MHUwMQ==" target="_blank" 
               class="link-item ripple-btn" 
               data-emoji="🎃" 
               data-text="Stay in touch & Suggestions 👻"
               data-theme="theme-instagram">
                <div class="link-left"><i class="fab fa-instagram link-icon"></i><span>Instagram</span></div>
                <i class="fas fa-chevron-right arrow"></i>
            </a>
            
            <a href="https://whatsapp.com/channel/0029Vb6lH8v3LdQN1sYXUv0r" target="_blank" 
               class="link-item ripple-btn" 
               data-emoji="😱" 
               data-text="Free 4K Anime Clips 📥"
               data-theme="theme-whatsapp">
                <div class="link-left"><i class="fab fa-whatsapp link-icon"></i><span>WhatsApp Channel</span></div>
                <i class="fas fa-chevron-right arrow"></i>
            </a>
        </div>

        <div class="footer"><p>Thanks for visiting! Be happy, keep smiling.</p></div>
    </div>

    <script>
        const boomBox = document.getElementById('boom-box');
        const mainEmoji = document.getElementById('main-emoji');
        const subtitle = document.getElementById('dynamic-text');
        const linkItems = document.querySelectorAll('.link-item');
        
        const defaultEmoji = "🌟";
        const defaultText = "Video Editor • Anime • Vibes";
        let isBooming = false;
        let savedThemeClass = ""; // To restore global theme after hover

        // 1. BOOM CLICK EFFECT
        function triggerBoom() {
            if (isBooming) return; 
            isBooming = true;
            boomBox.classList.add('boom-active');
            setTimeout(() => {
                boomBox.classList.remove('boom-active');
                isBooming = false;
            }, 500); 
        }
        boomBox.addEventListener('click', triggerBoom);
        boomBox.addEventListener('touchstart', triggerBoom, {passive: true});


        // 2. DAY/NIGHT TOGGLE LOGIC
        function toggleGlobalTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            
            if (body.classList.contains('dark-mode')) {
                // Switch to Day
                body.classList.remove('dark-mode');
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            } else {
                // Switch to Night
                body.classList.add('dark-mode');
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }
        }


        // 3. INTERACTION HANDLER (Emoji, Text, AND HOVER THEME)
        function activateLink(element) {
            const newEmoji = element.getAttribute('data-emoji');
            const newText = element.getAttribute('data-text');
            const themeClass = element.getAttribute('data-theme');
            
            // Save current mode (Dark or Day) to restore later
            // We only add the hover theme class, we don't remove dark-mode
            document.body.classList.add(themeClass);

            // Change Text
            subtitle.innerText = newText;
            subtitle.style.color = "var(--accent-color)";
            subtitle.style.transform = "scale(1.05)";

            // Change Emoji
            if(!isBooming) {
                mainEmoji.style.transform = "scale(0.1) rotate(-10deg)";
                setTimeout(() => {
                    mainEmoji.innerText = newEmoji;
                    mainEmoji.style.transform = "scale(1.2) rotate(10deg)";
                }, 100);
            }
        }

        function deactivateLink() {
            // Remove all Hover Theme classes
            document.body.classList.remove('theme-youtube', 'theme-instagram', 'theme-whatsapp');

            // Reset Text
            subtitle.innerText = defaultText;
            subtitle.style.color = "var(--text-color)";
            subtitle.style.transform = "scale(1)";

            // Reset Emoji
            if(!isBooming) {
                mainEmoji.style.transform = "scale(0.1)";
                setTimeout(() => {
                    mainEmoji.innerText = defaultEmoji;
                    mainEmoji.style.transform = "scale(1)";
                }, 100);
            }
        }

        linkItems.forEach(link => {
            link.addEventListener('mouseenter', () => activateLink(link));
            link.addEventListener('mouseleave', deactivateLink);
            link.addEventListener('touchstart', (e) => activateLink(link), {passive: true});
            link.addEventListener('touchend', () => setTimeout(deactivateLink, 800));
        });


        // 4. RIPPLE & PARTICLES
        function createRipple(event) {
            const button = event.currentTarget;
            const circle = document.createElement("span");
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;
            const rect = button.getBoundingClientRect();
            let clientX = event.clientX; let clientY = event.clientY;
            if(event.touches && event.touches.length > 0) { clientX = event.touches[0].clientX; clientY = event.touches[0].clientY; }
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${clientX - rect.left - radius}px`;
            circle.style.top = `${clientY - rect.top - radius}px`;
            circle.classList.add("ripple");
            const ripple = button.getElementsByClassName("ripple")[0];
            if (ripple) { ripple.remove(); }
            button.appendChild(circle);
        }
        const buttons = document.getElementsByClassName("ripple-btn");
        for (const button of buttons) {
            button.addEventListener("click", createRipple);
            button.addEventListener("touchstart", createRipple, {passive: true});
        }

        const particleContainer = document.getElementById('particles');
        function createStar() {
            const star = document.createElement('div'); const size = Math.random() * 3 + 1;
            star.style.width = size + 'px'; star.style.height = size + 'px'; star.style.background = 'var(--particle-color)';
            star.style.position = 'absolute'; star.style.left = Math.random() * 100 + 'vw'; star.style.top = Math.random() * 100 + 'vh';
            star.style.borderRadius = '50%'; star.style.opacity = Math.random() * 0.5 + 0.2;
            star.style.animation = `pulse ${Math.random() * 4 + 2}s infinite alternate`;
            particleContainer.appendChild(star);
        }
        for(let i=0; i<40; i++) { createStar(); }
    </script>
</body>
</html>
